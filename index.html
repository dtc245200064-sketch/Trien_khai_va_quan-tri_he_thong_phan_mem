<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đặt Lịch Hẹn</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; }
        input, select { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        #message { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; display: none; word-break: break-word; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>🗓️ Đặt Lịch Hẹn Trực Tuyến</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label>Họ và tên *</label>
            <input type="text" id="full_name" required placeholder="Tạ Văn Đức">
        </div>
        <div class="form-group">
            <label>Số điện thoại *</label>
            <input type="tel" id="phone" required placeholder="0583143761">
        </div>
        <div class="form-group">
            <label>Chọn Dịch Vụ *</label>
            <select id="service_id" required>
                <option value="1">Khám tổng quát (ID: 1)</option>
                <option value="2">Tư vấn sức khỏe (ID: 2)</option>
                <option value="3">Tái khám (ID: 3)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Chọn Khung Giờ (Slot ID) *</label>
            <select id="slot_id" required>
                <option value="1">Khung giờ 08:00 - 08:30 (ID: 1)</option>
                <option value="2">Khung giờ 09:00 - 09:30 (ID: 2)</option>
                <option value="3">Khung giờ 10:00 - 10:30 (ID: 3)</option>
                <option value="4">Khung giờ 14:00 - 14:30 (ID: 4)</option>
            </select>
        </div>
        <button type="submit">Xác Nhận Đặt Lịch</button>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById('message');
        msgDiv.style.display = 'none';

        const payload = {
            full_name: document.getElementById('full_name').value,
            phone: document.getElementById('phone').value,
            service_id: parseInt(document.getElementById('service_id').value),
            slot_id: parseInt(document.getElementById('slot_id').value)
        };

        try {
            const res = await fetch('/api/appointments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const rawText = await res.text();
            let data;
            try {
                data = JSON.parse(rawText);
            } catch (err) {
                data = { detail: rawText };
            }

            if (res.ok) {
                msgDiv.className = 'success';
                msgDiv.innerText = '🎉 Đặt lịch thành công! Mã ID: ' + (data.id || data.appointment_id || JSON.stringify(data));
                msgDiv.style.display = 'block';
                document.getElementById('bookingForm').reset();
            } else {
                msgDiv.className = 'error';
                msgDiv.innerText = '❌ Lỗi Backend (' + res.status + '): ' + (typeof data.detail === 'object' ? JSON.stringify(data.detail) : data.detail);
                msgDiv.style.display = 'block';
            }
        } catch (err) {
            msgDiv.className = 'error';
            msgDiv.innerText = '❌ Lỗi kết nối: ' + err.message;
            msgDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
