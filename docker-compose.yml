version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: appointment
      POSTGRES_USER: appointment_app
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appointment-net

  frontend:
    build: ./frontend
    container_name: appointment-frontend
    restart: always
    networks:
      - appointment-net

  backend:
    build: ./backend
    container_name: appointment-backend
    restart: always
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_DB: appointment
      POSTGRES_USER: appointment_app
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_PORT: 5432
    depends_on:
      - postgres-db
    networks:
      - appointment-net

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - appointment-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - appointment-net

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    networks:
      - appointment-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - appointment-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - appointment-net

networks:
  appointment-net:
    driver: bridge

volumes:
  postgres_data:
